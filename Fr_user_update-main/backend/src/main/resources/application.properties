spring.application.name=backend

# PostgreSQL: the application connects as fru_app, which owns nothing (see V0001).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fru}
spring.datasource.username=fru_app
spring.datasource.password=${FRU_APP_PASSWORD}

# Flyway connects separately, as fru_migrator (owns everything) — a distinct connection
# from spring.datasource above. See docs/components/persistence.md.
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fru}
spring.flyway.user=fru_migrator
spring.flyway.password=${DB_MIGRATOR_PASSWORD}
# Bracket notation, not dot notation: Spring's relaxed binding for a Map<String,String>
# property strips underscores from dot-separated key segments, which would silently rename
# this key and leave the SQL placeholder ${fru_app_password} unresolved. Found live by
# AppSchemaConnectivityIntegrationTest (S2-02) when Spring Boot's own FlywayAutoConfiguration
# ran this for the first time -- the Maven flyway-maven-plugin used until then parses its XML
# <placeholders> config independently and never exercised this path.
spring.flyway.placeholders[fru_app_password]=${FRU_APP_PASSWORD}
# S2-04: fru_sealer's password, needed only so V0030 can create the role during migration.
# The application itself never connects as fru_sealer — see docs/components/persistence.md.
spring.flyway.placeholders[fru_sealer_password]=${FRU_SEALER_PASSWORD}

# --- Capacity limits (S9-08) -------------------------------------------------------------------
#
# WHY THIS BLOCK EXISTS. The hosting specification issued to the bank states our concurrent
# capacity in AP-7: a number of database connections, a number of worker threads, and a failure
# time. Until this block, every one of those three numbers was a FRAMEWORK DEFAULT that nobody on
# this project had chosen -- 10 was HikariCP's `maxPoolSize`, 30 s was its `connectionTimeout`, 200
# was Tomcat's `threads.max`. The document did not describe our design; it transcribed Hikari's and
# Tomcat's, and a dependency upgrade could have changed what we had told a bank our system does
# with nothing failing and nothing warning.
#
# So the rule for this block: every limit that determines our published capacity is stated here
# with the reasoning for that value, even where the value we chose equals the default we
# inherited -- because "we chose 100" and "nobody set it" are different facts about a system, and
# only one of them is a commitment. CapacityConfigurationTest reads the LIVE objects -- the running
# Tomcat connector, the actual HikariDataSource -- and asserts each equals the value chosen here.
#
# WHAT THAT TEST DOES AND DOES NOT CATCH, stated exactly, because the useful version of this claim
# is the narrow one. It catches the motivating case on every line: a framework changing a default
# under an upgrade is caught wherever our value and the new default differ. It catches DELETION of
# a line only where our value differs from the default TODAY -- maximum-pool-size, connection-
# timeout, max-lifetime, keepalive-time, threads.max, max-connections, and the request-body limit.
# The remaining lines are STATED, NOT GUARDED: minimum-idle (HikariConfig.validate() coerces an
# unset minIdle to maxPoolSize, so 20 comes back either way), threads.min-spare, accept-count,
# task.scheduling.pool.size and threads.virtual.enabled all equal their framework default, and
# poll-interval is not asserted at all because @Scheduled carries its own :30s fallback. Deleting
# any of those five changes nothing and fails nothing. They are here to record a decision, which
# is worth doing, and not to defend one.
#
# THESE VALUES ARE REASONED, NOT YET MEASURED. They were chosen from the arithmetic each comment
# gives; the load harness that tests them against a running system is the next commit in this
# session, and any value that measurement revises will say so here.

# --- Connection pool ---
#
# THE BUDGET. docker-compose.yml applies no PostgreSQL tuning, so `max_connections` is the
# postgres:18 default of 100, of which 3 are superuser-reserved. The application is the only
# permanent consumer: the back-office API is served by this same process; `spring-boot-flyway`,
# the AUTOCONFIGURATION module, is `test`-scope by deliberate design (pom.xml, S2-02) so the shipped
# jar builds no Flyway DataSource at all and migration runs out of band as fru_migrator -- flyway-
# core itself is compile-scope, which is not the same claim; and there is exactly one application
# instance (AP-3). 20 therefore leaves ~77 connections
# spare for a migration, an operator's psql and any monitoring the bank attaches -- generous
# headroom on purpose, because the failure mode of being wrong here is a database that refuses
# connections to everyone rather than only to us.
#
# THE CEILING IS THE DATABASE, NOT THE BUDGET. SRV-DB is specified at 2 vCPU actual need, 4
# provisioned (§6.1). HikariCP's own sizing guidance -- connections ~= (cores x 2) + spindles --
# puts a 4-vCPU database at about 9 for CPU-bound work, which is why the inherited 10 was not an
# absurd number to have ended up with by accident. 20 is deliberately about twice that, and the
# reason is specific to this application rather than general: the identity-scan transaction holds
# its connection while writing ~4.8 MB of image bytea (IdentityScanService), and that hold is
# IO-bound -- it is not consuming a database core while it
# writes. Connections parked on IO do not contend for the CPU the sizing formula is about, so a
# pool sized only by that formula would idle cores during exactly the operation this journey does
# most. A pool wider than 20 stops buying anything: past that the work is CPU-bound again and the
# extra connections only move contention from our queue into the database's scheduler.
spring.datasource.hikari.maximum-pool-size=20
# Fixed-size pool, per HikariCP's own recommendation: a pool that grows on demand pays connection
# establishment -- and, against the bank's database, a full TLS handshake, since the AWS profile
# connects with sslmode=verify-full -- at precisely the moment it is already behind. The cost is
# 20 idle connections held permanently, which the budget above absorbs.
spring.datasource.hikari.minimum-idle=20
# 30 s (the inherited default) is a server's patience, not a customer's. This is the time a
# request waits for a connection BEFORE ANY WORK BEGINS; a customer who has waited that long on a
# Sudanese mobile network has abandoned the journey, and the request is still occupying a worker
# thread while they do. Failing at 10 s converts a silent stall into a retryable error and returns
# the worker. It is deliberately well above the connection-hold time this journey implies, so it
# fires only when the pool is genuinely saturated and never on ordinary contention.
#
# MILLISECONDS, NOT A DURATION STRING, for all three Hikari time values here. Unlike almost
# every other time-valued property in this file, spring.datasource.hikari.* is bound straight
# onto HikariConfig, whose setters take a primitive long -- there is no Duration target for
# Spring's duration converter to apply (verified against HikariConfig's own setter signatures),
# so `10s` on the next line would not be ten seconds -- it would be a binding failure at startup.
spring.datasource.hikari.connection-timeout=10000
# Shorter than the 30 min inherited default, and the reason is the bank's network rather than
# ours: a firewall or NAT idle timer that silently drops an established connection produces a
# broken connection the pool believes is good, and the first customer to draw it gets the error.
# 25 min retires a connection before a 30 min idle timer -- the common default -- can cut it.
# BR-4 asks the bank for the actual value on the path to SRV-DB; if it is shorter than 25 min,
# this line is what changes.
spring.datasource.hikari.max-lifetime=1500000
# Keeps an idle pooled connection warm so the same idle timer never sees it go quiet at all.
spring.datasource.hikari.keepalive-time=120000

# --- Worker threads ---
#
# THIS LIMIT IS BOUNDED BY HEAP, NOT BY CPU, and that is the whole reason it is not the inherited
# 200. There is no multipart endpoint in this application. The signature and the salary certificate
# arrive as base64 inside a JSON body, and Spring Boot applies no default size limit to a JSON body
# at all (`max-http-form-post-size` covers form posts only). Identity and liveness images do NOT
# arrive that way -- the client posts a JWS and the backend downloads the images from Uqudo
# server-side (IdentityScanService), which is a heap cost too but not a request-body one.
#
# The largest body is the salary certificate at 16 MB of base64
# (SalaryCertificateController.MAX_BASE64_LENGTH), whose length is checked only AFTER Jackson has
# materialised the whole string. Two result objects are obvious -- the ~16 MB LATIN1 String, and
# the ~12 MB byte[] Base64.getDecoder().decode allocates beside it. The parser's own intermediate
# buffers are NOT obvious and coexist with them at the moment of construction: a token this large
# cannot use Jackson's shared-input shortcut, so it accumulates through char segments at two bytes
# per character before the String is built. True peak per in-flight upload is therefore materially
# ABOVE the ~28 MB the two results account for -- the first draft of this comment said 28 MB and
# was wrong by roughly a factor of two.
#
# WHICH IS WHY 100 IS NOT JUSTIFIED BY THAT MULTIPLICATION, and the first draft's "100 is 2.8 GB,
# which is survivable" was bad reasoning on its own numbers: 2.8 GB of the ~3 GB heap the
# specification sizes (§4.1) leaves nothing for anything else, and the true figure is higher still.
# The real justification is the journey's shape. One customer uploads one certificate once, at one
# point in a journey that spans many minutes of reading, typing and scanning, so a hundred workers
# simultaneously on that path is not a load pattern this system can produce. 100 halves the
# inherited 200's exposure to a burst that does not exist, and costs nothing: 100 is already far
# past the point where more threads buy throughput on 4 vCPU, and surplus load belongs in the
# accept queue below, where it costs a socket rather than a stack and an upload's buffers.
#
# BL-167 tracks the real fix -- bounding CONCURRENT large uploads directly, rather than inferring a
# safe thread count from the largest single one. Until that exists, this number is the guard, and
# the S9-08 load harness can measure the true per-upload peak rather than reasoning about it.
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
# What happens past threads.max, which AP-7 previously described only as "further requests queue".
# One queued request per worker. Past this Tomcat refuses the connection outright, and that is the
# intent: a refusal is a fast, visible failure the mobile app can retry, whereas a deeper queue
# makes a customer wait minutes for a response to a request they abandoned long ago.
server.tomcat.accept-count=100
# The inherited default is 8192 -- established connections the connector will hold, including
# keep-alive sockets with no request in flight. At the 17 to 25 concurrent customers AP-7 states
# (section 4.1 and AP-3 say 20 to 30 for the same quantity -- a contradiction inside the document
# that S9-08 also resolves), that is
# four hundred times the need, and its only effect is to let a slow-client or half-open-socket
# pile-up consume memory before accept-count is ever reached. 1000 is still ample headroom for
# mobile keep-alive against this journey.
server.tomcat.max-connections=1000

# The per-request half of the heap arithmetic above. Nothing in the framework caps a JSON body, so
# until S9-08 the first code to consider the size of an upload was the controller's own
# MAX_BASE64_LENGTH check -- which runs after Jackson has already built the whole string. This is
# the boundary refusal, applied by RequestBodySizeLimitFilter to the two byte-carrying endpoints.
#
# 17 MB, not 16: SalaryCertificateController.MAX_BASE64_LENGTH is 16,000,000 characters of base64
# and the JSON envelope around it (field names, the profileId, the content type, quoting) is a few
# hundred bytes. The margin is deliberate -- this limit must never be what rejects a legitimate
# certificate, because the controller's check produces a useful message and this one produces a
# bare 413. RequestBodySizeLimitFilterTest asserts the two cannot drift into the wrong order.
fru.http.max-request-body-bytes=17000000

# Virtual threads are OFF, and this line is here because that is a capacity decision rather than
# an absence. Enabling them would make server.tomcat.threads.max meaningless and would largely
# dissolve the worker-occupancy limit that AP-7 now names as the binding constraint on the OTP
# path -- an inline send that parks a virtual thread costs a continuation, not a platform thread.
# It is therefore the most plausible future answer to that constraint AND a change that would
# invalidate the numbers in the hosting document, so it does not happen as a side effect of a
# Spring Boot upgrade or of somebody else's convenience. See BL-168.
spring.threads.virtual.enabled=false

# --- Scheduling ---
#
# Exactly one scheduler thread, stated rather than inherited. OutboxDispatchScheduler's javadoc
# records that the outbox design depends on ticks being serialised -- fixedDelay guarantees no
# overlap only while the pool cannot run two ticks at once. That dependency was resting on an
# unset property: `spring.task.scheduling.pool.size` happens to default to 1, so raising it for
# some unrelated future scheduled job would quietly let two dispatcher passes overlap.
spring.task.scheduling.pool.size=1

# Stated here rather than left to the @Scheduled annotation's own default, so that every number
# governing outbound throughput is readable in one place. The value is unchanged; what changes is
# that it is now visible next to the limits it interacts with.
#
# 5 s, down from the framework-default-shaped 30 s, and the reasoning changed twice while S9-08 was
# measuring -- which is the useful part of this comment.
#
# The ceiling is 30000/(P + 50L) submissions per hour, where L is the TOTAL per-message cost.
# Against the stub, L is the dispatcher's own 15.8 ms floor, P dominates completely, and this change
# looked like it was worth six times the ceiling. Against the REAL gateway it is not: two live sends
# through Airtel (S8-02, read back from audit.audit_event) took 1969 ms and 2144 ms, so L is about
# 2.1 s, 50L is about 104 s, and P is a minor term beside it. This change is worth about +23%:
# roughly 224 to 276 submissions per hour.
#
# It is still worth making, for a reason that has nothing to do with the ceiling. Queueing delay at
# the design load is P/(1 - lambda*L), so 30 s to 5 s takes a submission notification from arriving
# about 46 s after the event to about 8 s after it. That is the customer-visible number, and it
# improves sixfold even though the throughput number improves by a quarter.
#
# SAFE ONLY BECAUSE BL-169 IS FIXED. While the claim lease and the transient retry backoff were one
# hardcoded 30 s, shortening this interval made the overlap likelier; the two are now separate and
# separately justified above.
#
# THE LEVER THAT WOULD ACTUALLY MOVE THE CEILING IS CONCURRENCY -- 4 parallel sends gives about
# 480/hour, 8 gives about 700 -- and it is deliberately NOT taken. Airtel Technology Co. Ltd is a
# small Sudanese aggregator that publishes no rate limit, no TPS figure and no concurrency
# allowance anywhere, and an account throttled for firing 8 parallel requests would take the OTP
# route down with it. BR-13 asks the bank for those figures; BL-172 holds the change.
fru.notification.outbox.poll-interval=5s

# --- The two outbox intervals BL-169 separated ---------------------------------------------------
#
# These were ONE number until S9-08, and conflating them was the defect. A single hardcoded
# `interval '30 seconds'` in JdbcNotificationOutboxRepository served as both the claim lease and,
# by accident, the retry backoff for a transient failure -- because recording a TRANSIENT_FAILURE
# left the row `pending` and never reset next_attempt_at. A pass that outlived that one number
# found its own failed row due again and sent it a second time.
#
# CLAIM LEASE: how long a claimed row is hidden from other claims. It only has to cover ONE send,
# from the claim to the result being written -- the dispatcher claims, sends, records, then claims
# again. So the requirement is: longer than the worst case for a single send, which is Airtel's
# connect timeout plus its read timeout (5 s + 15 s = 20 s, AirtelSmsProperties). 30 s clears that
# with margin. It does NOT need to cover a whole pass, and sizing it as though it did would mean a
# crashed dispatcher stranding messages for many minutes.
fru.notification.outbox.claim-lease=30s
#
# TRANSIENT RETRY BACKOFF: when the provider says "try again later", how much later. The
# requirement is different and stricter: it must exceed the LONGEST POSSIBLE PASS, or the row falls
# due again inside the very pass that just failed it. Longest pass = MAX_ATTEMPTS_PER_TICK (50) x
# worst-case single send (20 s) = 1000 s. 20 minutes clears that.
#
# A long backoff is also the right behaviour on its own terms, not merely a consequence of the
# arithmetic: a transient failure means the gateway is struggling, and the correct response to a
# struggling gateway is to stop hitting it for a while. These are notifications, never OTPs -- an
# OTP is sent inline and never enters this queue.
fru.notification.outbox.transient-retry-backoff=20m

# --- Core banking (journey Stage 1a) -----------------------------------------------------------
#
# fru.core-banking.client selects the CoreBankingClient implementation. It is DELIBERATELY NOT SET
# HERE and has no default: a backend that silently ran a real customer's account check against a
# stub would be a serious and invisible defect, so an unset property fails at startup instead.
# Every environment states its own choice --
#   fru.core-banking.client=stub     local development, and every test
#   fru.core-banking.client=http     the real middleware CheckAccount call (S3-02, AD-007)
# See CoreBankingClientConfiguration. The choice is made once, by the container; there is no
# `if (mock)` branch anywhere in the call path.

# The real call (client=http) needs the middleware URL, which is configuration and never a
# default -- the host changes before production. Timeouts default to 5 s connect / 10 s read and
# are tunable here; omitting a timeout is the dangerous case, so the defaults are deliberate.
# Typical shape (the real host is supplied per environment, never committed):
#   fru.core-banking.http.endpoint=https://<middleware host>:9494/OMNI_PH3/resources/bankRoutes/CheckAccount
#   fru.core-banking.http.connect-timeout=5s
#   fru.core-banking.http.read-timeout=10s

# Stub seed. The key is the account number alone (the check carries no branch -- OQ-024) and the
# value is the raw CheckAccount Response_Code; anything absent from this table returns 0, "Account
# not Found", which is what the real middleware does with an account it has never heard of
# (observed live, S1-04). Seed -1 to simulate the middleware's own "System Error". All three
# middleware answers are therefore reachable: the two entries below, and any other input.
#
# SYNTHETIC VALUES ONLY -- no real account numbers, here or anywhere in this repository
# (CLAUDE.md hard rule).
fru.core-banking.stub.accounts[0000000001]=1
fru.core-banking.stub.accounts[0000000002]=-1

