# --- Outbound messaging (SMS/WhatsApp/email, journey stages 2, 11, 12) -------------------------
#
# One provider property PER CHANNEL, DELIBERATELY NOT SET HERE and with no default -- same
# reasoning as fru.core-banking.client above. Every environment states its own choice --
#   fru.messaging.<channel>.provider=stub   local development, and every test
#   fru.messaging.sms.provider=http         the real Airtel Sudan SMS gateway (BL-080)
# See MessageSenderConfiguration.
#
# 'http' is accepted for SMS ONLY. It is refused at startup for whatsapp and email, which have no
# real adapter at all -- SMS is the only messaging channel in the release version (product-owner
# decision 2026-09-07). Set those two to 'stub', or disable them.
#
# The SMS gateway's own configuration, when the selector is 'http' (see AirtelSmsProperties):
#   fru.messaging.sms.http.endpoint=https://<gateway host>/api/html_send_sms/
#   fru.messaging.sms.http.username=<from this environment's secret store>
#   fru.messaging.sms.http.password=<from this environment's secret store>
#   fru.messaging.sms.http.sender-id=<the registered sender shown to the customer>
#   fru.messaging.sms.http.connect-timeout=5s
#   fru.messaging.sms.http.read-timeout=15s
#
# NONE OF THOSE FIVE VALUES IS SET HERE AND NONE MAY EVER BE COMMITTED. The endpoint and sender id
# are configuration because they change before production; the username and password are SECRETS
# (CLAUDE.md: no secrets in code, prompts, logs or session reports) and come from Secrets Manager in
# a deployed environment, or a gitignored local file. Selecting 'http' without all four of endpoint,
# username, password and sender-id fails at startup naming the properties -- never the values.
#
# The password travels in the request QUERY STRING (the gateway's contract is a GET), which is why
# AirtelSmsSender never logs the request URI and never copies a RestClientException's message.
#
# fru.messaging.<channel>.enabled is a SEPARATE axis (default true if unset): it declares
# whether this deployment can verify that channel at all, independent of which implementation
# answers it. A disabled channel is removed from the router entirely, so a send to it returns
# CHANNEL_NOT_CONFIGURED rather than throwing. Stage 1b must read the same flags before ever
# offering a channel (R-042) -- not yet wired, out of scope for S3-05.

# Stub seed, mirroring fru.core-banking.stub.accounts: the key is the raw destination string, the
# value is the DispatchOutcome to return. Any destination absent from this table returns
# ACCEPTED, which is what a provider does with a message it has no reason to refuse.
#
# SYNTHETIC VALUES ONLY -- no real phone numbers or email addresses (CLAUDE.md hard rule).
fru.messaging.stub.outcomes[+249900000001]=REJECTED
fru.messaging.stub.outcomes[+249900000002]=TRANSIENT_FAILURE
fru.messaging.stub.outcomes[bounce@example.invalid]=PERMANENT_FAILURE

# --- Outbox dispatch schedule (S6-04) ----------------------------------------------------------
#
# How often OutboxDispatchScheduler drains app.notification_outbox, and how long it waits after
# startup before its first pass. UNLIKE the provider properties above these DO have defaults -- a
# wrong cadence is a tuning question, not a correctness one, so there is nothing dangerous about an
# unset value. Both accept a duration string (30s, 2m, 1h). Defaults, and the reasoning for 30s
# (it is exactly the claim lease in JdbcNotificationOutboxRepository.CLAIM_ONE_PENDING, and nothing
# in this queue is time-critical -- the OTP is sent inline, never enqueued), are on the scheduler
# class. Left commented out here so the class stays the single source of truth for the value.
#   fru.notification.outbox.poll-interval=30s
#   fru.notification.outbox.poll-initial-delay=30s

# --- Uqudo eKYC and Civil Registry (journey Stages 8-9) -----------------------------------------
#
# Same no-default reasoning as fru.core-banking.client above: DELIBERATELY NOT SET HERE.
#   fru.uqudo.client=stub            local development, and every test
#   fru.uqudo.client=http            the real Uqudo tenant
#   fru.civil-registry.client=stub   local development, and every test
#   fru.civil-registry.client=http   the bank's real GetCRSData service (AD-002b)
# See UqudoClientConfiguration / CivilRegistryClientConfiguration.

# The real Uqudo tenant (fru.uqudo.client=http) needs the whole block below. NONE of it has a
# default and none of it is committed: the tenant identifier and every endpoint are configuration,
# never hardcoded and never baked into a build (R-007, CLAUDE.md) -- the tenant changes before
# production, and we currently run on FIB's borrowed one (R-001). The credentials come from the
# local gitignored config only, never a committed file, a prompt, a log or a session report.
# Startup names every missing key at once rather than one per restart.
#
# The values below are the SHAPE, not defaults. `issuer` is the JWS `iss` claim, observed
# https://id.uqudo.io at S1-02; `client-id` is also the expected `aud` (observed to be exactly the
# client id), which is why there is no separate audience key.
#   fru.uqudo.http.auth-url=https://auth.uqudo.io/api
#   fru.uqudo.http.api-base=https://id.uqudo.io
#   fru.uqudo.http.jwks-url=https://id.uqudo.io/api/.well-known/jwks.json
#   fru.uqudo.http.issuer=https://id.uqudo.io
#   fru.uqudo.http.client-id=${UQUDO_CLIENT_ID}
#   fru.uqudo.http.client-secret=${UQUDO_CLIENT_SECRET}
#
# Tunable, with deliberate defaults -- omitting a timeout is the dangerous case, not a wrong value.
# 15 s read stays inside the mobile client's 30 s receive timeout. The JWKS is cached, refreshed
# ahead and rate-limited, never fetched per verification (docs/components/uqudo-sdk.md).
#   fru.uqudo.http.connect-timeout=5s
#   fru.uqudo.http.read-timeout=15s
#   fru.uqudo.http.jwks-cache-duration=15m

# The real Civil Registry call (client=http) needs the service URL, which is configuration and
# never a default -- the host is the bank's arrangement and changes before production. Timeouts
# default to 5 s connect / 15 s read (the reply carries a ~25 KB base64 photograph; 15 s stays
# inside the mobile client's 30 s receive timeout) and are tunable here. No in-adapter retry: the
# journey's own Stage 9 retry is the retry. Typical shape (the real host is supplied per
# environment, never committed):
#   fru.civil-registry.http.endpoint=https://<registry host>:5353/CRSAPI/Services/GetCRSData
#   fru.civil-registry.http.connect-timeout=5s
#   fru.civil-registry.http.read-timeout=15s

# Stub seed for the Civil Registry: the key is the raw identityNumber, the value is OK / NOT_FOUND
# / UNREACHABLE. Any identity number absent from this table returns OK, mirroring
# fru.messaging.stub.outcomes' unknown-means-the-honest-default reasoning.
#
# SYNTHETIC VALUES ONLY -- no real national numbers (CLAUDE.md hard rule).
fru.civil-registry.stub.outcomes[NID-TEST-NOT-FOUND]=NOT_FOUND
fru.civil-registry.stub.outcomes[NID-TEST-UNREACHABLE]=UNREACHABLE
