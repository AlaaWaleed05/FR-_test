# AD-002f (research report §6.7) — activated only via
# --spring.profiles.active=publish-reference-documents, never by default. See
# db/post-migrate/02-publish-reference-documents.md for the full runbook.
#
# Overrides spring.datasource.* (application.properties connects as fru_app, which owns nothing)
# to fru_migrator, the only role with INSERT/UPDATE on ref.reference_list_document and
# ref.reference_list_version.content_hash. Same env-var-only convention spring.flyway.* already
# uses in application.properties -- no secret literal here.
spring.datasource.username=fru_migrator
spring.datasource.password=${DB_MIGRATOR_PASSWORD}

# No web server for a one-shot command -- ReferenceDocumentPublicationRunner exits the process
# itself once publishAllCurrentVersions() returns.
spring.main.web-application-type=none
