# S1-02 Uqudo device spike -- Spring profile `uqudo-spike`. Throwaway plumbing, never production.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=uqudo-spike
# after exporting the repo-root .env (UQUDO_CLIENT_ID / UQUDO_CLIENT_SECRET / UQUDO_SPIKE_KEY).

# The six no-default implementation selectors, all stubbed -- the spike never goes through the
# UqudoClient port; it talks to Uqudo directly from the `spike` package.
fru.core-banking.client=stub
fru.messaging.sms.provider=stub
fru.messaging.whatsapp.provider=stub
fru.messaging.email.provider=stub
fru.uqudo.client=stub
fru.civil-registry.client=stub

# Tenant credentials: environment only, no defaults (CLAUDE.md hard rule).
fru.uqudo.spike.client-id=${UQUDO_CLIENT_ID}
fru.uqudo.spike.client-secret=${UQUDO_CLIENT_SECRET}
# Shared secret the spike phone sends as X-Spike-Key; keeps token minting off an open LAN.
fru.uqudo.spike.spike-key=${UQUDO_SPIKE_KEY}

# Public Uqudo hosts (docs/components/uqudo-*.openapi.yaml `servers:`; uqudo-api/authorisation.md).
fru.uqudo.spike.auth-url=${UQUDO_AUTH_URL:https://auth.uqudo.io/api}
fru.uqudo.spike.api-base=${UQUDO_API_BASE:https://id.uqudo.io}
fru.uqudo.spike.jwks-url=${UQUDO_JWKS_URL:https://id.uqudo.io/api/.well-known/jwks.json}

# Captures (raw JWS, images, shapes, spike.log). Under target/ so it is gitignored by default.
fru.uqudo.spike.output-dir=${UQUDO_SPIKE_OUTPUT_DIR:target/uqudo-spike}
