# Deployment profile for the AWS stack (S7). Activated with --spring.profiles.active=aws
# (or SPRING_PROFILES_ACTIVE=aws) by the ECS task definition.
#
# This file holds the properties that are true because of HOW the app is deployed on AWS,
# plus the explicit binding of every environment-varying selector to a named environment
# variable. It holds no values that differ between staging and production: those live in
# Parameter Store and Secrets Manager, and the task definition maps them onto the variable
# names below. The same image therefore runs as staging and as production, and the swap is a
# parameter-path change rather than a rebuild.

# --- BL-066: TLS terminates at the load balancer, not at this process ---------------------
# Without this, Boot sees the ALB's plain HTTP hop and believes the request scheme is `http`.
# It then issues JSESSIONID and XSRF-TOKEN WITHOUT the `Secure` attribute, so a bank
# operator's session cookie and CSRF token are both marked as safe to send over plaintext.
# Nothing fails, no error is logged, and the back office works normally — which is precisely
# why the pre-production audit had to find this by reading the config rather than by testing.
#
# `framework` uses Spring's ForwardedHeaderFilter to honour X-Forwarded-Proto/Host/Port.
#
# WHY THIS IS IN A PROFILE AND NOT IN application.properties. Honouring X-Forwarded-* means
# trusting whoever sets those headers. That is correct behind an ALB, which strips and
# rewrites them; it is a spoofing vector anywhere the app is reachable directly, because a
# caller could assert `X-Forwarded-Proto: https` and be believed. Putting it in the base file
# would enable it for local development and for any future direct-exposure deployment too.
#
# BL-066 IS NOT FULLY CLOSED BY THIS LINE. Its own text says the smoke-test assertion — that
# both cookies actually carry `Secure` after a sign-in through the ALB — matters more than the
# property, because this is exactly the class of defect that passes every local test. That
# assertion needs an ALB to exist and is tracked against S7-08.
server.forward-headers-strategy=framework

# --- BL-066, the half the property above does NOT fix (found live at S7-08) ----------------
# Measured through CloudFront on the running stack, both cookies came back WITHOUT `Secure`:
#     Set-Cookie: XSRF-TOKEN=...; Path=/
#     Set-Cookie: JSESSIONID=...; Path=/; HttpOnly
#
# The line above is necessary and not sufficient. It makes Boot honour X-Forwarded-Proto, and
# ELB documents that header as carrying "the protocol used between the client and the load
# balancer" -- CloudFront is the load balancer's client and connects over HTTP, so the ALB
# truthfully reports `http`. Boot then concludes the request was plaintext and omits `Secure`
# from both cookies. TLS terminates two hops earlier, at CloudFront, and the ALB cannot know.
#
# So the attributes are STATED here rather than inferred. This is not belt-and-braces over a
# working mechanism; the mechanism reports the wrong hop and always will under this topology.
# Both lines are scoped to this profile because a `Secure` cookie is silently DISCARDED over
# plain HTTP -- switching them on globally would break local development in the least
# debuggable way there is: sign-in succeeds, the cookie never arrives, the next request is
# anonymous. SecurityConfigurationCsrfCookieTest asserts both states.
server.servlet.session.cookie.secure=true
fru.security.cookies.require-secure=true

# --- The stub/real selectors, bound EXPLICITLY --------------------------------------------
# Every one of these fails startup if unset or misspelt. There is no default, deliberately: a
# backend must never run a real customer's check against a stub, or the reverse, because
# someone mistyped a parameter path.
#
# WHY THEY ARE WRITTEN OUT HERE RATHER THAN LEFT TO ENVIRONMENT VARIABLES. The hosting
# mapping's §9 is explicit that these keys are bound this way and NOT via Spring's relaxed
# environment-variable binding. The reason is the hyphens: `fru.core-banking.client` and
# `fru.civil-registry.client` would have to arrive as FRU_CORE_BANKING_CLIENT and be
# un-mangled by relaxed binding rules, and a key that silently fails to bind lands in the one
# failure mode this whole design exists to prevent — the property is absent, but absent for a
# reason nobody can see in the task definition. Naming the variable here makes the mapping
# from task definition to property an explicit, greppable line.
#
# An earlier draft of this file left the selectors out and said so as if it were a decision;
# it was in fact the exact mechanism §9 warns against. Corrected after review.
fru.core-banking.client=${FRU_CORE_BANKING_CLIENT}
fru.civil-registry.client=${FRU_CIVIL_REGISTRY_CLIENT}
fru.uqudo.client=${FRU_UQUDO_CLIENT}
fru.messaging.sms.provider=${FRU_MESSAGING_SMS_PROVIDER}
fru.messaging.whatsapp.provider=${FRU_MESSAGING_WHATSAPP_PROVIDER}
fru.messaging.email.provider=${FRU_MESSAGING_EMAIL_PROVIDER}

# --- Channel ENABLEMENT, which is not the same thing as the selector above (BL-097) ---------
# A provider says HOW a channel is delivered; this flag says WHETHER the channel is offered at
# all. WhatsApp needs both: its provider is `stub` because no real adapter exists, and without
# this flag the backend still MINTS a WhatsApp challenge and hands it to that stub, so a
# customer who ticks the box waits for a code nobody will ever send. ChannelSelection.resolve
# reads the flag; a DECLINED channel mints nothing.
#
# WHY IT IS WRITTEN OUT HERE RATHER THAN LEFT TO RELAXED BINDING. ContactChannelsService reads
# it through Environment.getProperty, so FRU_MESSAGING_WHATSAPP_ENABLED does in fact reach it
# unaided -- which is exactly how it came to be set on the live task definition at S8-08 while
# appearing in no repository file, and then to be dropped without trace by the documented
# redeploy script (BL-097). The hosting mapping's §9 rule is the one that would have prevented
# that: a hyphenated or nested key must not depend on relaxed binding, because the mapping from
# task definition to property has to be a greppable line rather than a rule a reader must know.
#
# The default is `true`, matching the code's own default, so omitting the variable changes
# nothing and an environment that CAN deliver WhatsApp does not have to state it.
fru.messaging.whatsapp.enabled=${FRU_MESSAGING_WHATSAPP_ENABLED:true}

# --- The Uqudo tenant: endpoints and credentials -------------------------------------------
# Declared at S7-07, when the task definition that supplies these values was written and the
# product owner filed the tenant's credentials in Secrets Manager.
#
# WHY THESE CARRY AN EMPTY DEFAULT (`:`) WHEN THE SELECTORS ABOVE CARRY NONE. The selectors
# must fail on absence, because a missing selector means nobody decided whether this backend
# talks to a real customer's tenant or a stub. These six are different: they are the values a
# selector DEMANDS, and UqudoClientConfiguration.requireFullyConfigured already checks them
# together and names every gap in one message that quotes R-007. An unresolvable `${...}`
# would pre-empt that check with a placeholder-resolution stack trace naming one variable,
# and it would also stop this same image from ever starting with fru.uqudo.client=stub --
# which the deployment design requires, since staging and production run the same artifact and
# differ only by parameter path. An empty value binds to null/blank and reaches the purpose-
# built check, which is the better error by some distance.
#
# The endpoints are Parameter Store values and the credentials are Secrets Manager values;
# neither is ever hardcoded here or baked into a build (R-007, and CLAUDE.md's rule that the
# tenant changes before production).
fru.uqudo.http.auth-url=${UQUDO_AUTH_URL:}
fru.uqudo.http.api-base=${UQUDO_API_BASE:}
fru.uqudo.http.jwks-url=${UQUDO_JWKS_URL:}
fru.uqudo.http.issuer=${UQUDO_ISSUER:}
fru.uqudo.http.client-id=${UQUDO_CLIENT_ID:}
fru.uqudo.http.client-secret=${UQUDO_CLIENT_SECRET:}

# --- The core banking CheckAccount endpoint ------------------------------------------------
# Added at S7-12. Until then this profile bound `fru.core-banking.client` but NOT the endpoint the
# `http` selector demands, so flipping FRU_CORE_BANKING_CLIENT to `http` on AWS would have failed
# at startup with "fru.core-banking.http.endpoint is not set" -- correctly, but only after a
# deploy. The Uqudo and Civil Registry blocks above were already wired this way; core banking was
# simply missed.
#
# Same empty-default reasoning as those two blocks: CoreBankingClientConfiguration.requireEndpoint
# performs its own check and names the property, which is a better error than an unresolvable
# placeholder -- and an empty default is what lets this same image also run with the selector set
# to `stub`, which staging still does.
#
# The value is a Parameter Store entry (/fru/staging/core-banking/endpoint), never a literal: the
# middleware host is the bank's and changes before production. Proven live from the backend's own
# network path at S7-12 (mb1...:9494 tcp=OPEN from Fargate) and against the real adapter the same
# day -- all three Response_Codes, including `1 Account Found` for the first time.
fru.core-banking.http.endpoint=${FRU_CORE_BANKING_ENDPOINT:}

# --- The Civil Registry endpoint -----------------------------------------------------------
# Same empty-default reasoning as the Uqudo block above: CivilRegistryClientConfiguration
# performs its own check when fru.civil-registry.client=http, and that check produces a better
# message than a placeholder-resolution failure would. The value is a Parameter Store entry
# (/fru/staging/civil-registry/endpoint) rather than a literal, because the registry host is
# the bank's and is not the same in every environment.
fru.civil-registry.http.endpoint=${FRU_CIVIL_REGISTRY_ENDPOINT:}

# --- TLS between the application and the database -----------------------------------------
# The connection is inside the VPC, but "inside the VPC" is not encryption. RDS presents a
# certificate; `require` makes the driver refuse a plaintext session rather than silently
# fall back to one, which is what the default `prefer` does.
#
# RAISED FROM `require` TO `verify-full` AT S7-07, which is where session 1 said it belonged:
# `require` encrypts but authenticates nothing, so it stops a passive eavesdropper and not an
# active one — anything that can answer on the endpoint's address presents its own certificate
# and the driver accepts it. `verify-full` additionally checks the chain against a known CA
# and checks the hostname, which is what makes the encryption mean something.
#
# The bundle is Amazon's GLOBAL RDS trust store, baked into the image by backend/Dockerfile at
# a fixed path. Global rather than eu-central-1's: it covers every region, so moving or
# rebuilding the database elsewhere is not also a certificate change. This DOES fail closed at
# startup if the file is missing -- that is the intended behaviour for a bank, and it is now a
# property of the image rather than of the environment, so it cannot fail closed in production
# without having failed closed here first.
#
# DB_CA_BUNDLE is overridable so a future region-pinned or bank-supplied trust store needs no
# rebuild, but its default is the path the Dockerfile actually writes.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full&sslrootcert=${DB_CA_BUNDLE:/opt/rds/global-bundle.pem}

# --- Flyway is NOT run by the application on AWS ------------------------------------------
# The shipped jar connects only as fru_app, which holds zero DDL rights (M-6). Migration is a
# separate privileged task connecting as fru_migrator. spring-boot-flyway is already
# test-scope only in pom.xml so this cannot silently activate, and this line states the
# intent for a reader of the deployment config rather than relying on that scoping alone.
spring.flyway.enabled=false

# --- The health endpoint the ALB target group checks (S7-07) -------------------------------
# Boot's own defaults already expose only `health` and already hide its details. Both are
# restated here anyway: a default that changes in a future Boot version would otherwise widen
# what an unauthenticated endpoint publishes, and this endpoint deliberately sits outside
# /api/v1/** where neither SecurityFilterChain applies to it.
#
# `never` matters. With details on, /actuator/health publishes the database vendor, the
# validation query outcome and the state of every health contributor -- an unauthenticated
# description of the bank's internals. The target group needs one word, so it gets one word.
#
# The DB health contributor stays ON (it is what makes this check worth making): a task that
# cannot reach RDS reports DOWN and the target group stops sending it traffic, instead of it
# accepting requests it can only fail. The consequence to know is that an RDS outage marks
# every task unhealthy rather than one -- correct, but it means an ECS replacement storm is a
# database-outage symptom, not an application fault. Do not "fix" that by hiding the DB check.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# --- The Airtel Sudan SMS gateway (BL-080, S8-02) -------------------------------------------
# Bound when FRU_MESSAGING_SMS_PROVIDER is `http`. Until S8-02 this profile bound the SMS
# SELECTOR but none of the four values that selector demands -- the same gap S7-12 found for core
# banking, in a new place: flipping the selector would have failed at startup naming four
# properties, correctly, but only after a deploy.
#
# WHY EXPLICIT LINES RATHER THAN RELAXED ENVIRONMENT-VARIABLE BINDING. AirtelSmsProperties is a
# @ConfigurationProperties record, so FRU_MESSAGING_SMS_HTTP_SENDER_ID would in fact bind onto
# `sender-id`. It is still written out here, because the hosting mapping's §9 is explicit that a
# hyphenated key must not depend on relaxed binding: a key that silently fails to bind lands in
# the one failure mode this design exists to prevent, and the mapping from task definition to
# property must be a greppable line rather than a rule a reader has to know.
#
# Same empty-default (`:`) reasoning as the Uqudo and core-banking blocks above:
# MessageSenderConfiguration.airtelSmsSender performs its own check and names EVERY missing
# property in one message, which is a better error than a placeholder-resolution stack trace
# naming one -- and an empty default is what lets this same image also run with the selector set
# to `stub`, which it must, since staging and production run one artifact.
#
# endpoint and sender-id are Parameter Store values: the gateway host and the customer-visible
# sender are configuration and change before production (R-007, CLAUDE.md). username and password
# are Secrets Manager values -- they are the bank's Airtel account credentials, they travel in the
# request QUERY STRING (the gateway's contract is a GET), and they may never appear in the
# repository, a log, a task definition literal or a session report.
#
# Reachability of www.airtel.sd:443 from the backend's own SG, subnet and NAT was proven at S8-02
# with 11-egress-probe.sh before any of this was wired (tcp=OPEN, Uqudo controls also OPEN).
fru.messaging.sms.http.endpoint=${FRU_MESSAGING_SMS_ENDPOINT:}
fru.messaging.sms.http.username=${FRU_MESSAGING_SMS_USERNAME:}
fru.messaging.sms.http.password=${FRU_MESSAGING_SMS_PASSWORD:}
fru.messaging.sms.http.sender-id=${FRU_MESSAGING_SMS_SENDER_ID:}
