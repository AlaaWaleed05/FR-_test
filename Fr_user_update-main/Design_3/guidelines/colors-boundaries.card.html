<!-- @dsCard group="Colors" viewport="700x170" name="Boundaries" subtitle="The field boundary is load-bearing — 3.4:1 on paper, clearing the 3:1 rule." -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { width:104px; height:56px; }
  .n { font-size:11px; font-family:var(--font-label); letter-spacing:.06em; color:var(--text-muted); }
  .v { font-size:11px; font-variant-numeric:tabular-nums; color:var(--text-subtle); }
</style>
<div style="display:flex; gap:14px; align-items:flex-end;">
  <div class="sw"><div style="width:150px; height:52px; border:1px solid var(--line-field); background:var(--paper);"></div><div class="n">FIELD</div><div class="v">--line-field · 3.4:1</div></div>
  <div class="sw"><div style="width:150px; height:52px; border:1px solid var(--line-rule); background:var(--paper);"></div><div class="n">ROW RULE</div><div class="v">--line-rule</div></div>
  <div class="sw"><div style="width:150px; height:52px; border:1px solid var(--line-soft); background:var(--paper);"></div><div class="n">SOFT</div><div class="v">--line-soft</div></div>
  <div class="sw"><div style="width:150px; height:52px; border:1.5px solid var(--steel-500); outline:2px solid var(--focus-ring); background:var(--paper);"></div><div class="n">FOCUS</div><div class="v">--focus-ring</div></div>
</div>
