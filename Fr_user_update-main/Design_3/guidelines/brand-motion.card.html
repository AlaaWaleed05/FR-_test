<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="Halo pulse, camel-gait bob, dust, and the indeterminate load rule." -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { width:104px; height:56px; }
  .n { font-size:11px; font-family:var(--font-label); letter-spacing:.06em; color:var(--text-muted); }
  .v { font-size:11px; font-variant-numeric:tabular-nums; color:var(--text-subtle); }
</style>
<div style="display:flex; gap:26px; align-items:center;">
  <div style="position:relative; width:96px; height:96px; display:grid; place-items:center;">
    <div style="position:absolute; width:96px; height:96px; border-radius:50%; background:radial-gradient(circle, rgba(89,128,166,.34) 0%, rgba(89,128,166,0) 68%); animation:bayanati-halo var(--dur-halo) var(--ease-loop) infinite;"></div>
    <div style="position:relative; width:62px; height:62px; border-radius:50%; overflow:hidden; background:#fff; animation:bayanati-bob 2.1s ease-in-out infinite;"><img src="../assets/sfb-logo-circle.png" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
  </div>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="width:160px; height:1.5px; background:rgba(11,28,71,.15); overflow:hidden;"><div style="width:100%;height:100%;background:var(--navy-800); animation:bayanati-load var(--dur-progress) var(--ease-progress) infinite;"></div></div>
    <div class="v">--ease-entrance · --ease-trek · --ease-progress</div>
    <div class="v">The mark is a rider on a camel — the bob and dust read as travel.</div>
  </div>
</div>
