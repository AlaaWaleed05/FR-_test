<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { width:104px; height:56px; }
  .n { font-size:11px; font-family:var(--font-label); letter-spacing:.06em; color:var(--text-muted); }
  .v { font-size:11px; font-variant-numeric:tabular-nums; color:var(--text-subtle); }
</style>
<div style="display:flex; gap:24px; align-items:center; flex-wrap:wrap;">
  <div style="width:78px; height:78px; border-radius:50%; overflow:hidden; box-shadow:var(--ring-pearl);"><img src="../assets/sfb-logo-circle.png" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
  <img src="../assets/sfb-wordmark-navy.png" style="height:44px;">
  <div style="background:var(--navy-800); padding:14px 18px;"><img src="../assets/sfb-wordmark-white.png" style="height:34px; display:block;"></div>
</div>
