<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { width:104px; height:56px; }
  .n { font-size:11px; font-family:var(--font-label); letter-spacing:.06em; color:var(--text-muted); }
  .v { font-size:11px; font-variant-numeric:tabular-nums; color:var(--text-subtle); }
</style>
<div class="row">
<div class="sw"><div class="chip" style="background:#3d5f80; "></div><div class="n">steel-700</div><div class="v">--steel-700</div></div><div class="sw"><div class="chip" style="background:#5980a6; "></div><div class="n">steel-500</div><div class="v">--steel-500</div></div><div class="sw"><div class="chip" style="background:#9dc0e0; "></div><div class="n">steel-300</div><div class="v">--steel-300</div></div><div class="sw"><div class="chip" style="background:#e7ecf2; border:1px solid var(--line-rule);"></div><div class="n">steel-100</div><div class="v">--steel-100</div></div><div class="sw"><div class="chip" style="background:#eef2f7; border:1px solid var(--line-rule);"></div><div class="n">steel-050</div><div class="v">--steel-050</div></div>
</div>
