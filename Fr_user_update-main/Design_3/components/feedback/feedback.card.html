<!-- @dsCard group="Components" viewport="700x330" name="Feedback" subtitle="Banners, offline, tags, terminal state" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .lbl { font-family:var(--font-label); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:7px; }
  .grid { display:grid; gap:18px; }
  
</style>
<div id="root"></div>
<script type="text/babel">
const NS = window.SFB_Bayanati || window.SFBBayanati || window.Bayanati || window.BayanatiDesignSystem ||
    Object.values(window).find(v => v && typeof v === 'object' && v.BrandBar && v.Button) || {};

const { Banner, OfflineBanner, Tag, TerminalState } = NS;
function Card() {
  return (
    <div dir="rtl" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
      <div style={{ display:'grid', gap:10 }}>
        <Banner tone="info">الحد اليومي للتحويل 50,000 جنيه.</Banner>
        <Banner tone="warn">بعد الإرسال لا يمكن التعديل من التطبيق.</Banner>
        <Banner tone="error">الرصيد غير كافٍ لإتمام هذه العملية.</Banner>
        <div style={{ background:'var(--paper)' }}><OfflineBanner /></div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <Tag>إدخال العميل</Tag><Tag tone="accent">السجل المدني</Tag><Tag tone="ok">موثقة</Tag><Tag tone="error">مرفوضة</Tag>
        </div>
      </div>
      <div style={{ background:'var(--paper)', display:'flex', minHeight:280 }}>
        <TerminalState tone="error"
          icon={<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>}
          title="تعذّر إكمال المسح"
          body="استنفدت عدد المحاولات المسموح بها. يمكنك المحاولة مرة أخرى بعد 24 ساعة أو زيارة أقرب فرع." />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
