<!-- @dsCard group="Components" viewport="700x230" name="Actions" subtitle="Primary, secondary, ghost, danger, inverse, disabled, busy" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .lbl { font-family:var(--font-label); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:7px; }
  .grid { display:grid; gap:18px; }
  
</style>
<div id="root"></div>
<script type="text/babel">
const NS = window.SFB_Bayanati || window.SFBBayanati || window.Bayanati || window.BayanatiDesignSystem ||
    Object.values(window).find(v => v && typeof v === 'object' && v.BrandBar && v.Button) || {};

const { Button, IconButton } = NS;
function Card() {
  return (
    <div dir="rtl" style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14 }}>
      <div><div className="lbl">PRIMARY</div><Button>التالي</Button></div>
      <div><div className="lbl">SECONDARY</div><Button variant="secondary">السابق</Button></div>
      <div><div className="lbl">GHOST</div><Button variant="ghost">إعادة المحاولة</Button></div>
      <div><div className="lbl">DANGER</div><Button variant="danger">إنهاء الجلسة</Button></div>
      <div><div className="lbl">DISABLED</div><Button disabled>التالي</Button></div>
      <div><div className="lbl">BUSY</div><Button busy>جاري الإرسال</Button></div>
      <div><div className="lbl">INVERSE (ON NAVY)</div><div style={{ background:'var(--navy-800)', padding:12 }}><Button variant="inverse">إنهاء</Button></div></div>
      <div><div className="lbl">ICON — INK / ON BRAND</div>
        <div style={{ display:'flex', gap:10 }}>
          <IconButton label="رجوع"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M9 18l6-6-6-6"/></svg></IconButton>
          <div style={{ background:'var(--navy-800)', padding:6 }}>
            <IconButton label="خروج" tone="onBrand" size={40}><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{transform:'scaleX(-1)'}}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></IconButton>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
