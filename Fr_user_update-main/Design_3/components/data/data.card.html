<!-- @dsCard group="Components" viewport="700x340" name="Data" subtitle="Review rows with provenance, channels, number plates" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:18px; background:var(--surface-canvas); font-family:var(--font-body); color:var(--text-body); }
  .lbl { font-family:var(--font-label); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:7px; }
  .grid { display:grid; gap:18px; }
  
</style>
<div id="root"></div>
<script type="text/babel">
const NS = window.SFB_Bayanati || window.SFBBayanati || window.Bayanati || window.BayanatiDesignSystem ||
    Object.values(window).find(v => v && typeof v === 'object' && v.BrandBar && v.Button) || {};

const { ReviewList, ReviewRow, ChannelRow, IdentityPlate, ReferencePlate } = NS;
const sms = <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M4 5h16v11H8l-4 4z"/></svg>;
const wa  = <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 12a9 9 0 1 1-3.6-7.2L21 3l-1.2 4.2A9 9 0 0 1 21 12z"/></svg>;
function Card() {
  return (
    <div dir="rtl" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
      <div style={{ background:'var(--paper)' }}>
        <ReviewList>
          <ReviewRow label="الاسم" value="محمد الأمين عبدالله" provenance="السجل المدني" />
          <ReviewRow label="الرقم الوطني" value="12345678901" ltr provenance="المسح" />
          <ReviewRow label="المهنة" value="موظف حكومي" provenance="إدخال العميل" last />
        </ReviewList>
        <div style={{ height:12 }} />
        <ReviewList>
          <ChannelRow icon={sms} name="الرسائل النصية" destination="+249 91 ••• 5678" status="موثقة" statusTone="ok" />
          <ChannelRow icon={wa} name="واتساب" destination="+249 91 ••• 5678" status="بانتظار الرمز" statusTone="accent" last />
        </ReviewList>
      </div>
      <div style={{ display:'grid', gap:14, alignContent:'start' }}>
        <IdentityPlate value="12345678901" note="قارن هذا الرقم بالرقم المدوّن في وثيقتك قبل المتابعة." />
        <ReferencePlate value="FRU-2026-004182" />
        <div style={{ background:'var(--navy-800)', color:'#fff', padding:14 }}><ReferencePlate value="FRU-2026-004182" onBrand /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
